<!doctype html>
<html lang="ja" dir="ltr"

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">

<title ar="3Dブロッカータップ" eo="3D Blokfrapeto" ja="3Dブロッカータップ" ko="3D 블로커 탭" ch="3D方块点击" en="3D Block Tap">3Dブロッカータップ</title>
<style id="app-style">
:root{--bg:#07111f;--panel:#0e1a2b;--panel2:#13243a;--text:#f5f9ff;--muted:#c6d3e2;--accent:#67e8ff;--danger:#ff8093;--line:#38516d;--shadow:0 16px 45px #0007}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#17304b 0,#07111f 45%,#030811 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow-x:hidden}
button,input,select{font:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px}button:hover{filter:brightness(1.16)}button.primary{background:linear-gradient(135deg,#1596c9,#3b5bd6);border-color:#5acfff}.danger{border-color:#873449}.small{font-size:.88rem;padding:7px 9px}
#header{position:sticky;top:0;z-index:50;background:#07111fee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);transition:.2s}
#header.hidden{display:none}#headerShow{position:fixed;top:12px;right:12px;z-index:120;display:none}.deleteOverlay{position:fixed;inset:0;background:#fff;z-index:5000;display:none;place-items:center;color:#111;font-weight:800;font-size:clamp(1.1rem,3vw,1.8rem);text-align:center;padding:24px;white-space:pre-line}.deleteOverlay.show{display:grid}.head{max-width:1200px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:1.25rem;font-weight:800;letter-spacing:.02em;margin-right:auto}.clock{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
.actions{display:flex;gap:7px;flex-wrap:nowrap;align-items:center;white-space:nowrap;overflow-x:auto;overflow-y:hidden;max-width:100%;scrollbar-width:thin}.actions>*{flex:0 0 auto}.tabs{max-width:1200px;margin:auto;padding:0 16px 12px;display:flex;gap:7px;overflow:auto}.tab.active{background:var(--accent);color:#04101a;border-color:var(--accent);font-weight:700}
main{max-width:1200px;margin:auto;padding:18px 16px 60px}.panel{background:linear-gradient(180deg,#0f1d30ee,#0a1423ee);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#ffffff06;border:1px solid var(--line);border-radius:12px;padding:14px}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3{margin-top:0;color:var(--text)}label{color:var(--text)}.card{color:var(--text)}.muted{color:var(--muted)}.scoreTable th{color:#ffffff;font-weight:800}.scoreTable td{color:#e9f1fa}.setting{color:#e9f1fa}input::placeholder,textarea::placeholder{color:#9fb0c2;opacity:1}a{color:#7be9ff}button{color:#f5f9ff}button.primary{color:#ffffff}.tab.active,.page.active{color:#06131d}.toast{color:#f5f9ff}
.tab{flex:0 0 auto;white-space:nowrap;writing-mode:horizontal-tb;word-break:keep-all;overflow-wrap:normal}.tabs{flex-wrap:nowrap}.game-control{white-space:nowrap;writing-mode:horizontal-tb;word-break:keep-all;flex:0 0 auto}.gamebar .row:first-child{min-width:0}.gamebar .game-control select{width:auto;min-width:6.5em;max-width:15em}.gamebar button{flex:0 0 auto;white-space:nowrap;writing-mode:horizontal-tb;word-break:keep-all}button{white-space:nowrap;writing-mode:horizontal-tb;word-break:keep-all}label{white-space:nowrap;writing-mode:horizontal-tb;word-break:keep-all}#gameWrap{position:relative;max-width:1000px;margin:auto}.gamebar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.stat{font-variant-numeric:tabular-nums}.stat b{color:var(--accent)}
#gameCanvas{display:block;width:100%;height:min(66vh,650px);min-height:390px;border-radius:16px;background:linear-gradient(#09192a,#07111f 55%,#030812);border:1px solid #35516d;touch-action:none;cursor:crosshair}
#stalker{position:fixed;z-index:1000;width:18px;height:18px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none;box-shadow:0 0 18px var(--accent);will-change:left,top;overflow:hidden;align-items:center;justify-content:center}#stalker.star{border:0;border-radius:0;box-shadow:none;font-size:20px;line-height:18px;color:var(--accent)}#stalker.square{border-radius:2px}#stalker.custom{border:0;border-radius:3px;box-shadow:0 0 10px #0008;background-size:cover;background-position:center;background-repeat:no-repeat}
label{display:flex;align-items:center;gap:8px}.setting{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff12}.setting:last-child{border-bottom:0}
input[type=text],input[type=number],select{background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;width:100%}.colorInput{width:55px;height:40px;padding:2px}.scoreTable{width:100%;border-collapse:collapse}.scoreTable th,.scoreTable td{padding:9px;border-bottom:1px solid #ffffff12;text-align:left}.pagination{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.page.active{background:var(--accent);color:#031019}
.share-url{width:100%;min-height:76px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.82rem;word-break:break-all}.share-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em}.live-line{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#07111ff2;border:1px solid var(--line);padding:11px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#0009;z-index:150;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalBox{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
pre{white-space:pre-wrap;word-break:break-word;background:#030812;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:330px;overflow:auto}
html[data-theme="light"]{--bg:#f4f7fb;--panel:#ffffff;--panel2:#eef3f8;--text:#17202a;--muted:#526273;--accent:#087ea4;--danger:#b4233c;--line:#c7d2de;--shadow:0 12px 32px #20304022}
html[data-theme="light"] body{background:radial-gradient(circle at 50% 0,#ffffff 0,#f3f7fb 52%,#e7edf4 100%);color:var(--text)}
html[data-theme="light"] #header{background:#ffffffee}
html[data-theme="light"] .panel{background:linear-gradient(180deg,#ffffffee,#f7fafdEE)}
html[data-theme="light"] .card{background:#00000005}
html[data-theme="light"] #gameCanvas{background:linear-gradient(#dceefa,#edf5fb 55%,#d9e5ef);border-color:#9bb1c5}
html[data-theme="light"] input[type=text],html[data-theme="light"] input[type=number],html[data-theme="light"] select{background:#ffffff;color:var(--text)}
html[data-theme="light"] pre{background:#f3f6f9}
html[data-theme="light"] .toast{background:#ffffffee}
html[data-theme="light"] .modalBox{background:#ffffff}
html[data-theme="light"] a{color:#006b8f}
@media (prefers-color-scheme: light){
  html[data-theme="auto"]{--bg:#f4f7fb;--panel:#ffffff;--panel2:#eef3f8;--text:#17202a;--muted:#526273;--accent:#087ea4;--danger:#b4233c;--line:#c7d2de;--shadow:0 12px 32px #20304022}
  html[data-theme="auto"] body{background:radial-gradient(circle at 50% 0,#ffffff 0,#f3f7fb 52%,#e7edf4 100%);color:var(--text)}
  html[data-theme="auto"] #header{background:#ffffffee}
  html[data-theme="auto"] .panel{background:linear-gradient(180deg,#ffffffee,#f7fafdEE)}
  html[data-theme="auto"] .card{background:#00000005}
  html[data-theme="auto"] #gameCanvas{background:linear-gradient(#dceefa,#edf5fb 55%,#d9e5ef);border-color:#9bb1c5}
  html[data-theme="auto"] input[type=text],html[data-theme="auto"] input[type=number],html[data-theme="auto"] select{background:#ffffff;color:var(--text)}
  html[data-theme="auto"] pre{background:#f3f6f9}
  html[data-theme="auto"] .toast{background:#ffffffee}
  html[data-theme="auto"] .modalBox{background:#ffffff}
  html[data-theme="auto"] a{color:#006b8f}
}
@media(max-width:650px){.head{padding:10px}.brand{width:100%;margin-right:0}.clock{font-size:.9rem}.actions{width:100%;flex-wrap:nowrap}.actions button{flex:0 0 auto}.tabs{padding-bottom:9px}main{padding:12px 10px 40px}.panel{padding:13px}#gameCanvas{min-height:420px;height:68vh}
/* スマホでもボタンを縦1列にせず、横並び＋必要時は横スクロール */
.row{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.row>button{flex:0 0 auto;width:auto;min-width:max-content;white-space:nowrap}
.between>.row{max-width:100%}
}

/* テーマ別の文字色コントラスト修正 */
html[data-theme="light"] .scoreTable th{color:#17202a}
html[data-theme="light"] .scoreTable td{color:#26313d}
html[data-theme="light"] .setting{color:#17202a}
html[data-theme="light"] label{color:#17202a}
html[data-theme="light"] .card{color:#17202a}
html[data-theme="light"] button{color:#17202a}
html[data-theme="light"] button.primary{color:#fff}
html[data-theme="light"] .toast{color:#17202a}
html[data-theme="light"] input::placeholder,html[data-theme="light"] textarea::placeholder{color:#687789}

html[data-theme="dark"] .scoreTable th{color:#fff}
html[data-theme="dark"] .scoreTable td{color:#e9f1fa}
html[data-theme="dark"] .setting{color:#f5f9ff}
html[data-theme="dark"] label{color:#f5f9ff}
html[data-theme="dark"] .card{color:#f5f9ff}
html[data-theme="dark"] button{color:#f5f9ff}
html[data-theme="dark"] .toast{color:#f5f9ff}

@media (prefers-color-scheme: light){
  html[data-theme="auto"] .scoreTable th{color:#17202a}
  html[data-theme="auto"] .scoreTable td{color:#26313d}
  html[data-theme="auto"] .setting{color:#17202a}
  html[data-theme="auto"] label{color:#17202a}
  html[data-theme="auto"] .card{color:#17202a}
  html[data-theme="auto"] button{color:#17202a}
  html[data-theme="auto"] button.primary{color:#fff}
  html[data-theme="auto"] .toast{color:#17202a}
  html[data-theme="auto"] input::placeholder,html[data-theme="auto"] textarea::placeholder{color:#687789}
}
.scoreTable{min-width:760px}.scoreTable th,.scoreTable td{white-space:nowrap}</style>
<template id="duration-options-template">
  <option value="15">15</option>
  <option value="30">30</option>
  <option value="46">46</option>
  <option value="60">60</option>
  <option value="75">75</option>
  <option value="90">90</option>
  <option value="105">105</option>
  <option value="120">120</option>
</template>
</head>
<body>
<div id="stalker"></div>

<header id="header">
  <div class="head">
    <div class="brand" id="brand">3Dブロッカータップ</div>
    <div class="clock" id="clock">--:--</div>
    <div class="actions">
      <label class="small" ar="اللغة" eo="Lingvo" ja="言語" ko="언어" ch="语言" en="Language" style="display:flex;align-items:center;gap:5px;padding:0;border:0;background:transparent">🌐
        <select id="langSelect" aria-label="Language" ar="اللغة" eo="Lingvo" ja="言語" ko="언어" ch="语言" en="Language" style="width:auto;padding:7px 9px">
          <option value="ar" ar="العربية" eo="Araba" ja="アラビア語" ko="아랍어" ch="阿拉伯语" en="Arabic">AR</option>
          <option value="eo" ar="الإسبرانتو" eo="Esperanto" ja="エスペラント" ko="에스페란토" ch="世界语" en="Esperanto">EO</option>
          <option value="ja" ar="اليابانية" eo="Japana" ja="日本語" ko="일본어" ch="日语" en="Japanese">JA</option>
          <option value="ko" ar="الكورية" eo="Korea" ja="韓国語" ko="한국어" ch="韩语" en="Korean">KO</option>
          <option value="ch" ar="الصينية المبسطة" eo="Simpligita ĉina" ja="簡体字中国語" ko="중국어 간체" ch="简体中文" en="Simplified Chinese">中文</option>
          <option value="en" ar="الإنجليزية" eo="Angla" ja="英語" ko="영어" ch="英语" en="English">EN</option>
        </select>
      </label>
      <button id="backupBtn" class="small" title="Backup" ar="نسخ احتياطي" eo="Sekurkopio" ja="バックアップ" ko="백업" ch="备份" en="Backup">⬇ .itsme</button>
      <button id="restoreBtn" class="small" title="Restore" ar="استعادة" eo="Restarigi" ja="復元" ko="복원" ch="恢复" en="Restore">⬆</button>
      <input id="restoreInput" type="file" accept=".itsme,application/json" hidden>
      <button id="deleteBtn" class="small danger" title="Delete all data" ar="حذف جميع البيانات" eo="Forigi ĉiujn datumojn" ja="データ全削除" ko="모든 데이터 삭제" ch="删除全部数据" en="Delete all data">🗑</button>
      <button id="headerToggle" class="small" title="Header" ar="الرأس" eo="Kapo" ja="ヘッダー" ko="헤더" ch="页眉" en="Header">☰</button>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<button id="headerShow" class="small" ar="إظهار الرأس" eo="Montri kapon" ja="ヘッダーを表示" ko="헤더 표시" ch="显示页眉" en="Show header">☰</button>

<main id="app"></main>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="modalBox">
    <h2 id="modalTitle" ar="خطأ" eo="Eraro" ja="エラー" ko="오류" ch="错误" en="Error">エラー</h2>
    <p id="modalText"></p>
    <div class="row"><button class="primary" id="modalClose" ar="موافق" eo="Bone" ja="OK" ko="확인" ch="确定" en="OK">OK</button></div>
  </div>
</div>
<div class="modal" id="confirmModal">
  <div class="modalBox">
    <h2 id="confirmTitle" ar="تأكيد الحذف" eo="Konfirmo de forigo" ja="削除確認" ko="삭제 확인" ch="删除确认" en="Delete confirmation">削除確認</h2>
    <p id="confirmText"></p>
    <div class="row"><button class="primary" id="confirmYes" ar="نعم" eo="Jes" ja="Yes" ko="예" ch="是" en="Yes">Yes</button><button id="confirmNo" ar="لا" eo="Ne" ja="No" ko="아니요" ch="否" en="No">No</button></div>
  </div>
</div>
<div class="deleteOverlay" id="deleteOverlay"><div id="deleteOverlayText"></div></div>


<template id="durationOptionsTemplate">
  <option value="15">15</option><option value="30">30</option><option value="46">46</option><option value="60">60</option>
  <option value="75">75</option><option value="90">90</option><option value="105">105</option><option value="120">120</option>
</template>

<script id="app-script" src="script.js?v=1.0.1"></script>
